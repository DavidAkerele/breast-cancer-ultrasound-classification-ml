<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Path Not Found | OncoVision AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030303;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #00e5ff;
            --accent-secondary: #8b5cf6;
            --error-color: #ff1744;
            --error-glow: rgba(255, 23, 68, 0.2);
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle dark background radial glow */
        .background-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, #f43f5e 0%, transparent 70%);
            filter: blur(140px);
            z-index: -1;
            opacity: 0.12;
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            max-width: 480px;
            width: 90%;
            text-align: center;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 30px;
            backdrop-filter: blur(24px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-family: 'Space Grotesk', monospace;
            font-size: 5rem;
            font-weight: 700;
            color: var(--error-color);
            text-shadow: 0 0 30px var(--error-glow);
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: var(--error-color);
            padding: 4px 12px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            border-radius: 20px;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.15);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 229, 255, 0.3);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <div class="error-code">404</div>
        <span class="status-badge">Path Not Found</span>
        <h1>Radiological Path Missing</h1>
        <p>The requested clinical resource, patient directory, or API route does not exist on this diagnostic server. Please verify your URL path.</p>
        <a href="/" class="btn">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Return to Control Panel
        </a>
    </div>
</body>
</html>
