<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Ultrasound Research Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f6f4ee;
            --surface: #fffdf8;
            --ink: #10243f;
            --muted: #617083;
            --teal: #087f75;
            --teal-dark: #075f59;
            --line: #d9d5ca;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 620px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--line);
            padding: clamp(32px, 7vw, 72px);
            box-shadow: 0 20px 60px rgba(16, 36, 63, 0.08);
        }

        .error-code {
            font-family: 'Space Grotesk', monospace;
            font-size: clamp(4.5rem, 15vw, 8rem);
            font-weight: 700;
            color: var(--teal);
            line-height: 0.85;
            margin-bottom: 28px;
            letter-spacing: -0.07em;
        }

        .status-badge {
            display: inline-block;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            padding: 9px 0;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 24px;
            letter-spacing: 0.12em;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.65rem, 5vw, 2.35rem);
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: -0.04em;
        }

        p {
            font-size: 1rem;
            color: var(--muted);
            line-height: 1.65;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--teal);
            border: 1px solid var(--teal);
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 160ms ease, transform 160ms ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: var(--teal-dark);
        }

        .btn:focus-visible {
            outline: 3px solid rgba(8, 127, 117, 0.25);
            outline-offset: 3px;
        }

        .btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <span class="status-badge">Research workspace · path not found</span>
        <h1>This page is outside the study route.</h1>
        <p>The requested page or research API route does not exist. Return to the workspace to inspect the model, dataset audit, and provisional evaluation record.</p>
        <a href="/" class="btn">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Return to workspace
        </a>
    </div>
</body>
</html>
