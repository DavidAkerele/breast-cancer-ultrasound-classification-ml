<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background transparent -->
  <!-- Outer glowing abstract ribbon/neural path -->
  <path d="M 30,80 C 35,55 50,40 65,40 C 78,40 85,50 82,65 C 78,80 60,82 50,70 C 42,60 45,35 60,20 C 70,10 80,15 80,15" 
        fill="none" 
        stroke="url(#glow-grad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        filter="url(#neon-glow)" />
  <!-- Neural node circles -->
  <circle cx="30" cy="80" r="5" fill="#38bdf8" />
  <circle cx="65" cy="40" r="4.5" fill="#6366f1" />
  <circle cx="82" cy="65" r="4.5" fill="#818cf8" />
  <circle cx="50" cy="70" r="5" fill="#38bdf8" />
  <circle cx="60" cy="20" r="5.5" fill="#a78bfa" />
  <!-- Connecting line -->
  <line x1="65" y1="40" x2="60" y2="20" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="50" y1="70" x2="82" y2="65" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="2,2" />
</svg>
